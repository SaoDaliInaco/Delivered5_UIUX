<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout</title>
<link rel="stylesheet" href="checkout.css">
</head>
<body>

<!-- Back Button -->
<svg width="38" height="38" viewBox="0 0 24 24" fill="black" xmlns="http://www.w3.org/2000/svg">
  <path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z"/>
</svg>

<h1 class="checkout-title">Checkout</h1>

<div class="checkout-grid">

    <div class="card">
        <h2 class="card-title">Order Summary</h2>
        <p>Order no #12344</p>
        <p>Place on: 29.11.2025</p>
        <p>Total: 21.5$</p>
    </div>

    <div class="card">
        <h2 class="card-title">Payment Details</h2>
        <img src="image/aba.png" class="bank-icon">
        <p>005 235 393</p>
        <p>Mariana</p>
    </div>

    <div class="card">
        <h2 class="card-title">Pick up Information</h2>
        <p>Mariana</p>
        <p>66, str.288, Toulkok, Phnom Penh</p>
        <p>+855 92 836 003</p>
    </div>

</div>

<div class="total-box">
    <p><strong>Subtotal:</strong> 20$</p>
    <p><strong>Wrapping Cost:</strong> 1.5$</p>
    <p><strong>Total:</strong> 21.5$</p>
</div>

<div id="orderPopup" class="popup">
        <div class="popup-content">
            <div class="popup-icon">✔</div>
            <h2>Thank you for<br>your order!</h2>
            <button id="goHomeBtn" class="home-btn">Go back to homepage</button>
        </div>
    </div>

    <button id="checkoutBtn" class="order-btn">Order</button>

    <script>
    document.getElementById("checkoutBtn").addEventListener("click", function() {
        document.getElementById("orderPopup").style.display = "flex";
    });

    document.getElementById("goHomeBtn").addEventListener("click", function() {
        window.location.href = "Homepage.html";
    });
    </script>


</body>
</html>
