<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile - Pipecraft</title>
  <link rel="stylesheet" href="Profile.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

  
  <header>
    <h1 class="brand">Pipecraft.nc</h1>
  </header>

  
  <section class="profile">
    <h2>Profile</h2>

    <div class="profile-card">
      <img src="image/50964dd2dde0828247aaf26f697f93aa.jpg" alt="profile picture" class="profile-pic">
      <div class="profile-info">
        <h3>Mariana</h3>
        <p>Point: 34</p>
      </div>
    </div>

  </section>

  
  <section>
    <h2>Account</h2>
    <div class="card-group">
        <div class="card">Account Detail</div>
        <div class="card">Payment Detail</div>
        <div class="card">Notification</div>
        <div class="card">Log Out</div>
    </div>
  </section>

  
  <section>
    <h2>Orders</h2>
    <div class="card-group">
        <div class="card">Order History</div>
        <div class="card">Reward and Coupon</div>
    </div>
  </section>

  
  <section>
    <h2>Preferences</h2>
    <div class="card-group">
      <div class="card">Address Management</div>
    </div>
  </section>
  <br>

  <nav class="bottom-nav">
    <i class="fa-solid fa-house"></i>
    <i class="fa-solid fa-bell"></i>
    <i class="fa-solid fa-user"></i>
  </nav>

  <div class="bottom-nav">

    <!-- Home -->
    <a href="Homepage.html">
      <svg class="icon" width="28" height="28" viewBox="0 0 24 24" fill="black">
        <path d="M3 9.5L12 3L21 9.5V20C21 20.55 20.55 21 20 21H15C14.45 21 14 20.55 14 20V15H10V20C10 20.55 9.55 21 9 21H4C3.45 21 3 20.55 3 20V9.5Z"/>
      </svg>
    </a>

    <!-- Notification -->
    <a href="notification.html">
      <svg class="icon" width="28" height="28" viewBox="0 0 24 24" fill="black">
        <path d="M12 2C10.34 2 9 3.34 9 5V6.29C6.39 7.15 4.5 9.58 4.5 12.36V17L3 18.5V19H21V18.5L19.5 17V12.36C19.5 9.58 17.61 7.15 15 6.29V5C15 3.34 13.66 2 12 2ZM12 22C13.38 22 14.5 20.88 14.5 19.5H9.5C9.5 20.88 10.62 22 12 22Z"/>
      </svg>
    </a>

    <!-- Profile -->
    <a href="Profile.html">
      <svg class="icon" width="28" height="28" viewBox="0 0 24 24" fill="black">
        <path d="M12 12C9.24 12 7 9.76 7 7C7 4.24 9.24 2 12 2C14.76 2 17 4.24 17 7C17 9.76 14.76 12 12 12ZM4 22V20C4 16.69 6.69 14 10 14H14C17.31 14 20 16.69 20 20V22H4Z"/>
      </svg>
    </a>

  </div>

</body>
</html>
