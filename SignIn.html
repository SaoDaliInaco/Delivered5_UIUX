<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PipeCraft Sign Up</title>
  <link rel="stylesheet" href="SignIn.css">
</head>
<body>

  <div class="signup-box">
    <div class="logo">
        <img src="image/photo_2025-12-06_11-49-50.jpg" alt="PipeCraft Logo">
    </div>


    <h1>Create new account</h1>
    <p>Fill your information and start sending flowers to your love one!</p>

    <form>
      <div class="input-group">
        <label>Username</label>
        <input type="text" placeholder="Enter username" required>
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="Enter email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Enter password" required>
      </div>

      <button class="signup-btn" onclick="window.location='Welcome1.html'; return false;">Sign Up</button>

    </form>

    <div class="social-text">Or sign up with</div>

    <div class="social-icons">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/IOS_Google_icon.png" alt="Google">
    </div>

  </div>

  <script src="SignIn.js"></script>
    
</body>
</html>
